name: transport-sharing

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-scooter}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scooter}
      POSTGRES_DB: ${POSTGRES_DB:-scooter}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-scooter} -d ${POSTGRES_DB:-scooter}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  backend:
    build: ./backend
    environment:
      # Inside the compose network the database is always db:5432,
      # regardless of the port published on the host.
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-scooter}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scooter}
      POSTGRES_DB: ${POSTGRES_DB:-scooter}
      DEBUG: ${DEBUG:-false}
      LOW_BATTERY_THRESHOLD: ${LOW_BATTERY_THRESHOLD:-15}
      BOOKING_TTL_SECONDS: ${BOOKING_TTL_SECONDS:-900}
      BOOKING_WARN_BEFORE_SECONDS: ${BOOKING_WARN_BEFORE_SECONDS:-180}
      BOOKING_SWEEP_INTERVAL_SECONDS: ${BOOKING_SWEEP_INTERVAL_SECONDS:-2}
      RIDE_RATE_PER_MINUTE: ${RIDE_RATE_PER_MINUTE:-5.00}
      PAUSE_RATE_PER_MINUTE: ${PAUSE_RATE_PER_MINUTE:-1.50}
    # Apply migrations (verifies the DB connection), seed the demo fleet, then serve the API
    command: sh -c "alembic upgrade head && python -m app.seed && exec uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy

  simulator:
    build: ./simulator
    environment:
      BACKEND_URL: http://backend:8000
      SIM_ACTIVE_SCOOTERS: ${SIM_ACTIVE_SCOOTERS:-6}
      SIM_INTERVAL_SECONDS: ${SIM_INTERVAL_SECONDS:-1.5}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
